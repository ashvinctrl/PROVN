name: Provn CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cd provn-cli && cargo fmt --all --check

      - name: cargo clippy -D warnings
        run: cd provn-cli && cargo clippy --all-targets -- -D warnings

  test:
    # provn ships macOS and Windows binaries and main.rs carries three
    # cfg(target_os)-split cmd_server implementations, so the suite has to run
    # on every platform it is released for — a Linux-only job cannot even
    # compile the other two.
    name: Test — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            provn-cli/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('provn-cli/Cargo.lock') }}

      - name: Build
        run: cd provn-cli && cargo build --release

      - name: Test
        run: cd provn-cli && cargo test --release

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          MSRV=$(grep -m1 '^rust-version' provn-cli/Cargo.toml | tr -d ' "' | cut -d= -f2)
          echo "version=$MSRV" >> $GITHUB_OUTPUT
          echo "MSRV is $MSRV"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Build at MSRV
        run: cd provn-cli && cargo build --locked

  provn-scan:
    name: Security scan (Layer 1+2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            provn-cli/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('provn-cli/Cargo.lock') }}

      - name: Build Provn CLI
        run: cd provn-cli && cargo build --release

      - name: Scan diff for secrets/IP leaks
        run: bash ./scripts/ci-scan.sh
