name: Update Homebrew Formula

# Deliberately NOT triggered by `release: [published]`. The release is created by
# release.yml using the built-in GITHUB_TOKEN, and GitHub suppresses workflow
# triggers for events raised by that token (loop prevention) — so a `release`
# trigger here would never fire. Instead release.yml calls this workflow
# directly via `workflow_call` once the release job succeeds, and
# `workflow_dispatch` is kept for re-running it by hand against any tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish to the tap (e.g. v0.3.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to the tap (e.g. v0.3.0)
        required: true
        type: string

jobs:
  update-formula:
    name: Publish formula to homebrew-tap
    runs-on: ubuntu-latest
    steps:
      - name: Check Homebrew publishing is configured
        id: tap_auth
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -n "$TAP_GITHUB_TOKEN" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::warning::TAP_GITHUB_TOKEN not configured; skipping Homebrew formula update."
          fi

      - name: Resolve version from tag
        if: steps.tap_auth.outputs.enabled == 'true'
        id: release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Download release assets and compute SHA-256
        if: steps.tap_auth.outputs.enabled == 'true'
        id: sha
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}"

          download_sha() {
            name=$1
            # --retry covers the brief window where assets are still settling
            # on the CDN right after the release job publishes them.
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
              "$BASE/$name" -o "/tmp/$name"
            sha256sum "/tmp/$name" | awk '{print $1}'
          }

          echo "sha_aarch64_macos=$(download_sha provn-aarch64-apple-darwin.tar.gz)" >> $GITHUB_OUTPUT
          echo "sha_x86_64_macos=$(download_sha provn-x86_64-apple-darwin.tar.gz)" >> $GITHUB_OUTPUT
          echo "sha_aarch64_linux=$(download_sha provn-aarch64-linux.tar.gz)" >> $GITHUB_OUTPUT
          echo "sha_x86_64_linux=$(download_sha provn-x86_64-linux.tar.gz)" >> $GITHUB_OUTPUT

      # The formula updater lives in this repo, so it has to be on disk before
      # the update step can call it. Checked out to its own path so it does not
      # collide with the tap checkout below.
      - name: Checkout Provn (for the formula updater script)
        if: steps.tap_auth.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          path: provn-src

      - name: Checkout homebrew-tap
        if: steps.tap_auth.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        if: steps.tap_auth.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA_AARCH64_MACOS: ${{ steps.sha.outputs.sha_aarch64_macos }}
          SHA_X86_64_MACOS: ${{ steps.sha.outputs.sha_x86_64_macos }}
          SHA_AARCH64_LINUX: ${{ steps.sha.outputs.sha_aarch64_linux }}
          SHA_X86_64_LINUX: ${{ steps.sha.outputs.sha_x86_64_linux }}
        run: |
          cd homebrew-tap
          python3 ../provn-src/scripts/update-homebrew-formula.py Formula/provn.rb

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/provn.rb
          git commit -m "provn $VERSION" || echo "No changes"
          git push
