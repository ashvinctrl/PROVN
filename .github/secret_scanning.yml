# Exclude benchmark / model-training corpora from secret scanning.
# These files are labelled test fixtures of INTENTIONALLY FAKE secrets used to
# measure Provn's own detection (see provn-cli/tests/corpus/ and the LeakBench
# datasets). They contain no live credentials, so secret-scanning alerts on them
# are false positives.
#
# Note: GitHub reads this config from the default branch only.
paths-ignore:
  - "provn-cli/tests/corpus/**"
  - "aegis-model/data/**"
  - "leakbench_sample.jsonl"
